<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #data {
            max-width: 600px;
            margin: 20px auto;
        }

        #data div {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        #data h3 {
            margin: 0 0 8px;
            color: #333;
        }

        #data p {
            margin: 5px 0;
            color: #555;
        }

        #myChart {
    width: 90% !important;
    height: 500px !important;
    max-width: 1000px;
    margin: 40px auto;
    display: block;
}
        .chart-container {
    width: 90%;
    max-width: 900px;
    height: 500px;
    margin: 40px auto;
}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <h1>Student Data</h1>

    <div id="data"><canvas id="myChart"></canvas></div>

    <script>

        const students = [
            { name: "Prince", marks: 85 },
            { name: "Omkar", marks: 72 },
            { name: "Amit", marks: 90 }
        ];

        let output = "";

        students.forEach(student => {

            output += `
                <div>
                    <h3>${student.name}</h3>
                    <p>Marks: ${student.marks}</p>
                </div>
            `;

        });

        document.getElementById("data").innerHTML = output;


        const ctx = document.getElementById("myChart");

        new Chart(ctx, {
            type: "bar",

            data: {
                labels: ["Prince", "Omkar", "Amit"],

                datasets: [{
                    label: "Marks",
                    data: [85, 72, 90]
                }]
            },
            options: {
        responsive: true,
        maintainAspectRatio: false
    }
        });

    </script>

</body>

</html>
